<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail OTP Verification</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>Welcome back</h1>

      <p class="subtitle">
        Sign in with your Gmail address and verify your identity with a one-time password.
      </p>

      <div id="emailSection">

        <label for="email">Email address</label>

        <div class="input-group">
          <input
            type="email"
            id="email"
            placeholder="example@gmail.com"
          >

          <button type="button" id="sendBtn">
            Send OTP
          </button>
        </div>

        <p id="emailMessage" class="message"></p>

      </div>

      <div id="otpSection" class="hidden">

        <label for="otp">Enter OTP</label>

        <input
          type="text"
          id="otp"
          placeholder="Enter 6-digit OTP"
          maxlength="6"
          inputmode="numeric"
        >

        <button type="button" id="verifyBtn">
          Verify OTP
        </button>

        <p id="otpMessage" class="message"></p>

      </div>

    </div>
  </div>

  <script src="/script.js"></script>

</body>
</html>
