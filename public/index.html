<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail OTP Verification</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="icon">✉️</div>

      <h1>Email Verification</h1>

      <p class="subtitle">
        Enter your Gmail address to receive a one-time verification code.
      </p>

      <!-- Email Section -->
      <div id="emailSection">

        <label for="email">Email address</label>

        <div class="input-group">
          <input
            type="email"
            id="email"
            placeholder="example@gmail.com"
            autocomplete="email"
          >

          <button type="button" id="sendBtn">
            Send OTP
          </button>
        </div>

        <!-- IMPORTANT -->
        <p id="emailMessage" class="message"></p>

      </div>

      <!-- OTP Section -->
      <div id="otpSection" class="hidden">

        <label for="otp">Enter OTP</label>

        <input
          type="text"
          id="otp"
          placeholder="Enter 6-digit OTP"
          maxlength="6"
          inputmode="numeric"
          autocomplete="one-time-code"
        >

        <div class="timer">
          OTP expires in:
          <strong id="timer">05:00</strong>
        </div>

        <button type="button" id="verifyBtn">
          Verify OTP
        </button>

        <button type="button" id="resendBtn" class="secondary" disabled>
          Resend OTP
        </button>

        <!-- IMPORTANT -->
        <p id="otpMessage" class="message"></p>

      </div>

    </div>
  </div>

  <script src="/script.js"></script>

</body>
</html>
